[project]
name = "backstage-catalog"
version = "0.1.0"
description = "Daily-built catalog of Backstage plugins published on npm"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "markdown>=3.11.3",
    "mkdocs-material>=9.6",
    "nh3>=0.3.7",
    "properdocs>=1.6",
    "pymdown-extensions>=13.1",
    "rich>=14",
    "ruamel.yaml>=0.18",
]

[project.scripts]
backstage-catalog = "backstage_catalog.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "ruff>=0.12",
    "types-markdown>=3.11.3.20261108",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backstage_catalog"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "RET"]

[tool.mypy]
strict = true
python_version = "3.13"
